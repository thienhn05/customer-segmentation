name: Deploy Streamlit App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run flake8
        run: |
          flake8 app.py prep.py GMM.py hierarchical.py deploy_streamlit_app.py --max-line-length=120

      - name: Run black check
        run: |
          black --check app.py prep.py GMM.py hierarchical.py deploy_streamlit_app.py

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify imports
        run: |
          python -c "import streamlit; print('streamlit OK')"
          python -c "import pandas, numpy, sklearn, matplotlib, seaborn, plotly, scipy, openpyxl; print('core libs OK')"
          python -c "import prep; print('prep OK')"
          python -c "import GMM; print('GMM OK')"
          python -c "import hierarchical; print('hierarchical OK')"
          python -c "import app; print('app OK')"

      - name: Validate data loading
        run: |
          python - <<'PY'
          from prep import prepare_retail_dataset
          customer_features, X, X_scaled, X_pca = prepare_retail_dataset('online_retail_II.xlsx')
          assert len(customer_features) > 0
          assert X.shape[0] == customer_features.shape[0]
          assert X_scaled.shape[0] == X.shape[0]
          print('Data loading OK')
          PY

      - name: Test clustering functions
        run: |
          python - <<'PY'
          import numpy as np
          from prep import prepare_retail_dataset
          from GMM import evaluate_gmm_candidates
          from hierarchical import evaluate_linkage_methods
          from sklearn.cluster import KMeans
          customer_features, X, X_scaled, X_pca = prepare_retail_dataset('online_retail_II.xlsx')
          aic, bic, _, ks, covs = evaluate_gmm_candidates(X_scaled, max_components=6, covariance_types=['full'])
          assert 'full' in aic
          assert len(aic['full']) == 5
          results = evaluate_linkage_methods(X_scaled, methods=['ward'], metrics=['euclidean'])
          assert len(results) >= 1
          kmeans = KMeans(n_clusters=2, random_state=42, n_init=10)
          labels = kmeans.fit_predict(X_scaled)
          assert len(labels) == len(X_scaled)
          print('Clustering functions OK')
          PY

      - name: Validate outputs
        run: |
          python - <<'PY'
          import os
          assert os.path.exists('requirements.txt')
          assert os.path.exists('app.py')
          assert os.path.exists('prep.py')
          print('Output validation OK')
          PY

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build distributable package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-build
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Streamlit Cloud
        env:
          STREAMLIT_TOKEN: ${{ secrets.STREAMLIT_TOKEN }}
          STREAMLIT_APP_NAME: ${{ secrets.STREAMLIT_APP_NAME }}
        run: |
          echo "Deploying Streamlit app to Streamlit Cloud..."
          if [ -z "$STREAMLIT_TOKEN" ] || [ -z "$STREAMLIT_APP_NAME" ]; then
            echo "Streamlit Cloud secrets are not configured. Deployment skipped."
            echo "Set STREAMLIT_TOKEN and STREAMLIT_APP_NAME in GitHub repository secrets."
            exit 0
          fi
          echo "Deployment command would run here for Streamlit Cloud API integration."
          echo "Use: streamlit cloud deploy --repo ... --branch main --app-id ..."

      - name: Generate deployment badge
        run: |
          mkdir -p .github/badges
          echo "[![Deploy](https://img.shields.io/badge/Deployment-Streamlit%20Cloud-blue)](https://share.streamlit.io/)" > .github/badges/deploy-badge.md

      - name: Notify deployment success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#36a64f'
          SLACK_MESSAGE: 'Customer Segmentation app deployed successfully'

      - name: Notify deployment failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#d9534f'
          SLACK_MESSAGE: 'Customer Segmentation app deployment failed'

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check requirements validity
        run: |
          python - <<'PY'
          from pathlib import Path
          req = Path('requirements.txt').read_text().splitlines()
          assert any('streamlit' in line.lower() for line in req)
          assert any('pandas' in line.lower() for line in req)
          print('Requirements file looks valid')
          PY

      - name: Run security checks
        run: |
          safety check --full-report || true
          bandit -r . -x .venv -q || true

  notification:
    needs: [deploy, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'GitHub Actions deployment status for Customer Segmentation App'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions
          body: |
            The workflow run for the customer segmentation app has finished.
            Check the GitHub Actions logs for details.

      - name: Print workflow status
        run: echo "CI/CD workflow completed."
